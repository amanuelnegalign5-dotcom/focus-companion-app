
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b32">
<title>Focus Companion</title>
<style>
:root{--green:#173b32;--cream:#f6f4ed;--gold:#e9c46a;--ink:#24342e}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Ethiopic",sans-serif}
header{background:var(--green);color:white;padding:26px 20px 24px;border-radius:0 0 25px 25px}
header small{opacity:.8}
h1{font-size:27px;margin:10px 0}
header p{margin:0;color:#e2e9e3}
main{max-width:600px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 3px 15px #173b3210}
h2{font-size:18px;margin:0 0 13px}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:12px;border:1px solid #d9ded7;border-radius:10px;margin:5px 0 10px;background:#fff}
button{border:0;border-radius:11px;padding:12px 15px;background:var(--green);color:white;cursor:pointer}
.secondary{background:#e9eee8;color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
#timer{font-size:44px;font-weight:700;text-align:center;margin:16px}
.center{text-align:center}
.task{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #eee}
.task input{width:auto;margin:0}
.task span{flex:1;overflow-wrap:anywhere}
.done{text-decoration:line-through;opacity:.55}
footer{text-align:center;padding:15px;color:#65756c;font-size:12px}
</style>
</head>
<body>
<header>
<small>ዛሬን በትኩረት ኑር</small>
<h1>Focus Companion 🌱</h1>
<p>ትንሽ እርምጃ። ግልጽ ዓላማ። ቋሚ እድገት።</p>
</header>
<main>
<section class="card">
<h2>🎯 የዛሬ ዋና 3 ተግባራት</h2>
<div id="tasks"></div>
<input id="taskInput" placeholder="የምትሠራውን ጻፍ...">
<button onclick="addTask()">+ ተግባር ጨምር</button>
</section>
<section class="card center">
<h2>⏳ የትኩረት ጊዜ</h2>
<div id="timer">25:00</div>
<div class="row">
<button onclick="startTimer()">ጀምር</button>
<button class="secondary" onclick="pauseTimer()">አቁም</button>
<button class="secondary" onclick="resetTimer()">እንደገና</button>
</div>
<p><small>25 ደቂቃ ትኩረት፣ 5 ደቂቃ እረፍት።</small></p>
</section>
<section class="card">
<h2>📝 ፈጣን ማስታወሻ</h2>
<textarea id="notes" rows="4" placeholder="ሐሳብህን እዚህ ጻፍ..."></textarea>
<button onclick="saveNotes()">ማስታወሻ አስቀምጥ</button>
<p id="saved" aria-live="polite"></p>
</section>
<section class="card">
<h2>🌿 የዛሬ ግምገማ</h2>
<textarea id="review" rows="3" placeholder="ዛሬ ምን አሳካሁ? ነገ ምን አሻሽላለሁ?"></textarea>
<button onclick="saveReview()">ግምገማ አስቀምጥ</button>
<p id="reviewSaved" aria-live="polite"></p>
</section>
</main>
<footer>Focus Companion · የግል የትኩረት ቦታ</footer>
<script>
const get=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
let tasks=[];
try{tasks=JSON.parse(get('fc-tasks','[]'))}catch(e){}
function renderTasks(){
const box=document.getElementById('tasks');box.innerHTML='';
tasks.forEach((t,i)=>{
const row=document.createElement('div');row.className='task';
const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
cb.onchange=()=>{tasks[i].done=cb.checked;persistTasks();renderTasks()};
const label=document.createElement('span');label.textContent=t.text;
if(t.done)label.className='done';
const del=document.createElement('button');del.textContent='×';del.className='secondary';
del.onclick=()=>{tasks.splice(i,1);persistTasks();renderTasks()};
row.append(cb,label,del);box.append(row);
});
}
function persistTasks(){put('fc-tasks',JSON.stringify(tasks))}
function addTask(){
const input=document.getElementById('taskInput');const text=input.value.trim();
if(!text)return;
if(tasks.length>=3){alert('ከ3 ተግባራት በላይ አትጨምር። መጀመሪያ አንዱን አጠናቅቅ ወይም ሰርዝ።');return}
tasks.push({text,done:false});persistTasks();renderTasks();input.value='';
}
document.getElementById('notes').value=get('fc-notes','');
document.getElementById('review').value=get('fc-review','');
function saveNotes(){
const ok=put('fc-notes',document.getElementById('notes').value);
document.getElementById('saved').textContent=ok?'ተቀምጧል ✓':'ማስቀመጥ አልተቻለም።';
}
function saveReview(){
const ok=put('fc-review',document.getElementById('review').value);
document.getElementById('reviewSaved').textContent=ok?'ተቀምጧል ✓':'ማስቀመጥ አልተቻለም።';
}
let seconds=1500,interval=null;
function drawTimer(){document.getElementById('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function startTimer(){
if(interval)return;
interval=setInterval(()=>{if(seconds>0){seconds--;drawTimer()}else{clearInterval(interval);interval=null;alert('የትኩረት ጊዜህ አልቋል። እረፍት ውሰድ!')}},1000);
}
function pauseTimer(){clearInterval(interval);interval=null}
function resetTimer(){pauseTimer();seconds=1500;drawTimer()}
renderTasks();drawTimer();
</script>
</body>
</html>
